{% extends 'base.html' %}
{% block title %}Page Not Found{% endblock %}
{% block content %}
<div class="min-h-screen flex flex-col items-center justify-center text-center px-4 py-20">
  <div class="text-8xl mb-4">🌍</div>
  <h1 class="text-6xl font-extrabold text-primary mb-3">404</h1>
  <p class="text-xl text-gray-500 mb-2">{{ message or "Page not found" }}</p>
  <p class="text-gray-400 text-sm mb-8">The page you're looking for doesn't exist or has moved.</p>
  <a href="{{ url_for('main.index') }}"
     class="bg-primary text-white px-8 py-3 rounded-full font-bold hover:bg-green-800 transition">
    ← Back to Homepage
  </a>
</div>
{% endblock %}
